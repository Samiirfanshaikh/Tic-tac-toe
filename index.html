<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="./output.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="min-h-screen bg-[#548687]">
    <main class="min-h-screen flex flex-col items-center justify-center gap-8 p-4">
        <!-- Heading -->
        <h1 class="text-3xl font-bold font-serif text-black">
            Tic Tac Toe
        </h1>
        <!-- Game Board -->
        <div class="grid grid-cols-3 gap-3">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
        <!-- Game Message -->
        <p id="msg" class="text-xl font-bold text-white min-h-7"></p>
        <!-- Reset Button -->
        <button
            id="reset-btn"
            class="bg-[#191913] text-white px-5 py-3 rounded-xl text-base hover:bg-gray-800 transition">
            Reset Game
        </button>
    </main>
</body>
</html>
