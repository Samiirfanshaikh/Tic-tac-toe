<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="./output.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="min-h-screen bg-green-700 text-center">
    <main class="min-h-screen flex flex-col items-center justify-center gap-2 p-4">
        <div class="msg-container hidden flex-col items-center gap-2">
            <p id="msg" class="text-3xl font-bold text-yellow-100"></p>
            <button id="new-game-btn" class="bg-gray-900 text-white px-6 py-3 rounded-xl hover:bg-gray-700 transition">New Game
            </button>
        </div>
        <h1 class="text-4xl font-bold text-white">Tic Tac Toe</h1>
        <div class="grid grid-cols-3 gap-2">
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600  hover:bg-yellow-200"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600 hover:bg-yellow-200"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600 hover:bg-yellow-200"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600 hover:bg-yellow-200"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600"></button>
            <button class="box w-20 h-20 sm:w-24 sm:h-24 bg-red-500 rounded-xl text-4xl font-bold text-red-600"></button>
        </div>
        <button id="reset-btn" class="bg-gray-900 text-white px-6 py-3 rounded-xl hover:bg-gray-700 transition">
            Restart
        </button>
    </main>
    </body>
</html>
